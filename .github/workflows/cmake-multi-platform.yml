name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VULKAN_VERSION: 1.4.304.1
  VULKAN_COMPONENTS: Vulkan-Headers, Vulkan-Loader
  BUILD_TYPE: Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-lib:
    name: Linux Lib (${{ matrix.display_server }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        display_server: [Wayland, X11]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_VERSION }}
          vulkan-components: ${{ env.VULKAN_COMPONENTS }}
          vulkan-use-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake xorg-dev
          if [ "${{ matrix.display_server }}" = "Wayland" ]; then
            sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev
          fi

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: dependencies/
          key: ${{ runner.os }}-eos-deps-${{ hashFiles('cmake/deps-lock.cmake') }}
          restore-keys: |
            ${{ runner.os }}-eos-deps-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-eos-${{ matrix.display_server }}

      - name: Configure
        run: >
          cmake -B build -DEOS_BUILD_EXAMPLES=OFF
          -DUSE_WAYLAND=${{ matrix.display_server == 'Wayland' && 'ON' || 'OFF' }}
          -DUSE_X11=${{ matrix.display_server == 'X11' && 'ON' || 'OFF' }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-linux-${{ matrix.display_server }}
          path: lib/
          retention-days: 7
          if-no-files-found: error

  windows-lib:
    name: Windows Lib
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_VERSION }}
          vulkan-components: ${{ env.VULKAN_COMPONENTS }}
          vulkan-use-cache: true

      - uses: lukka/get-cmake@v3.31.6

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: dependencies/
          key: ${{ runner.os }}-eos-deps-${{ hashFiles('cmake/deps-lock.cmake') }}
          restore-keys: |
            ${{ runner.os }}-eos-deps-

      - name: Configure
        run: cmake -B build -DEOS_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-windows
          path: build/${{ env.BUILD_TYPE }}/
          retention-days: 7
          if-no-files-found: error