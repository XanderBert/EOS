# Cascaded shadow maps fit on the CPU, over the camera's whole depth range: cpuCascades is data made in C++ (main.cpp)
# that reads the camera's View and the sun on the CPU and uploads the cascades. Pick another technique with the panel's
# graph list.
data:
  Camera:   { type: flyCamera, origin: [0, 1, 0], speed: 100 }
  Sponza:   { type: gltfScene, path: sponza/Sponza.gltf }
  Sun:      { type: sun, rotation: [-73, -90], intensity: 3 }
  Cascades: { type: cpuCascades }

passes:
  Early-Z:  { shader: earlyZ }
  Shadow:   { shader: shadowDepth }
  Shade:    { shader: shade, shadows: Cascades }

edges:
  - Sponza.scene       -> Early-Z.scene
  - Camera.view        -> Early-Z.view

  - Camera.view        -> Cascades.view
  - Sun.light          -> Cascades.light

  - Sponza.scene       -> Shadow.scene
  - Cascades.cascades  -> Shadow.cascades

  - Sponza.scene       -> Shade.scene
  - Camera.view        -> Shade.view
  - Sun.light          -> Shade.sun
  - Early-Z.depth      -> Shade.depth
  - Cascades.cascades  -> Shade.cascades
  - Shadow.shadowMap   -> Shade.shadowMap
  - Shade.color        -> swapchain
