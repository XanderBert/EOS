# Cascaded shadow maps fit on the GPU: the depth reduction finds the depth range the camera sees, and cascadeSetup fits
# the cascades to it. Pick another technique with the panel's graph list: csmCpu fits them on the CPU, csmRayQuery
# traces rays instead. The pass types are the Slang files in ../shaders; gltfScene, flyCamera and sun come with the
# engine.
passes:
  Camera:            { type: flyCamera, origin: [0, 1, 0], speed: 100 }
  Sponza:            { type: gltfScene, path: sponza/Sponza.gltf }
  Sun:               { type: sun, rotation: [-73, -90], intensity: 3 }
  Early-Z:           { type: earlyZ }
  Reset Depth Range: { type: resetDepthRange }
  Depth Reduction:   { type: depthReduction }
  Cascade Setup:     { type: cascadeSetup, useDepthReduction: true }
  Shadow:            { type: shadowDepth }
  Shade:             { type: shade, shadows: Cascades }

edges:
  - Sponza.scene                 -> Early-Z.scene
  - Camera.view                  -> Early-Z.view

  # Fit the cascades to the visible depth range.
  - Early-Z.depth                -> Depth Reduction.depth
  - Reset Depth Range.depthRange -> Depth Reduction.depthRange
  - Depth Reduction.depthRange   -> Cascade Setup.depthRange
  - Camera.view                  -> Cascade Setup.view
  - Sun.light                    -> Cascade Setup.sun

  - Sponza.scene                 -> Shadow.scene
  - Cascade Setup.cascades       -> Shadow.cascades

  - Sponza.scene                 -> Shade.scene
  - Camera.view                  -> Shade.view
  - Sun.light                    -> Shade.sun
  - Early-Z.depth                -> Shade.depth
  - Cascade Setup.cascades       -> Shade.cascades
  - Shadow.shadowMap             -> Shade.shadowMap
  - Shade.color                  -> swapchain
