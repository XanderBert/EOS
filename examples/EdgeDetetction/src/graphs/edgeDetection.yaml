# The frame of the edge detection example, and all there is to it: main.cpp only runs this file. Edit it while the
# example runs and press '-' to reload it (and the shaders).
#
# Data is made on the CPU: gltfScene and flyCamera come with the engine. Passes run on the GPU: gbuffer, deferredLight
# and edgeDetect are the Slang files in ../shaders, named by module. swapchain is the window's image.

data:
  Camera:  { type: flyCamera, origin: [0, 1, 0], speed: 100 }
  Sponza:  { type: gltfScene, path: sponza/Sponza.gltf }

passes:
  Geometry:
    shader: gbuffer
  Deferred Lighting:
    shader: deferredLight
    debugView: Lit
    lightDirection: [-0.4, -1.0, -0.3]
    lightIntensity: 1.0
    lightColor: [1.0, 0.98, 0.92]
    ambient: 0.3
  Edge Detect:
    shader: edgeDetect
    threshold: 4.0
    edgesOnly: false

edges:
  - Sponza.scene             -> Geometry.scene
  - Camera.view              -> Geometry.view

  - Geometry.albedo          -> Deferred Lighting.albedo
  - Geometry.normal          -> Deferred Lighting.normal
  - Geometry.worldPos        -> Deferred Lighting.worldPos
  - Camera.view              -> Deferred Lighting.view

  - Deferred Lighting.output -> Edge Detect.color
  - Geometry.normal          -> Edge Detect.normal
  - Edge Detect.output       -> swapchain
