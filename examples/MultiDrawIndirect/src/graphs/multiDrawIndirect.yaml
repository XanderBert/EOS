# The frame of the multi-draw indirect example, and all there is to it: main.cpp only runs this file. Its one pass,
# ../shaders/forward.slang, draws every mesh of the scene with one indirect draw.
data:
  Camera: { type: flyCamera, origin: [0, 1, 0], speed: 100 }
  Sponza: { type: gltfScene, path: sponza/Sponza.gltf }

passes:
  Forward:
    shader: forward
    lightDirection: [-1.0, -1.0, -1.0]
    lightIntensity: 3.0
    lightColor: [1.0, 1.0, 1.0]
    ambient: 0.3

edges:
  - Sponza.scene  -> Forward.scene
  - Camera.view   -> Forward.view
  - Forward.color -> swapchain
