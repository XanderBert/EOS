# The frame of the depth of field example, and all there is to it: main.cpp only runs this file. Edit it while the
# example runs and press '-' to reload it (and the shaders).
#
# Data is made on the CPU: gltfScene and flyCamera come with the engine. Passes run on the GPU: each is a Slang file in
# ../shaders, named by module, whose [Pass] struct declares its pins and properties. An edge connects an output pin to an
# input pin ("Name.pin"); swapchain is the window's image.
# Try disabling "DOF Composite" (enabled: false): Present then gets the lit scene through the composite's bypass.

data:
  Camera:  { type: flyCamera, origin: [0, 1, 0], speed: 100 }
  Sponza:  { type: gltfScene, path: sponza/Sponza.gltf }

passes:
  Geometry:
    shader: gbuffer
  Deferred Lighting:
    shader: deferredLightCompute
    debugView: Lit
    lightDirection: [-0.4, -1.0, -0.3]
    lightIntensity: 1.0
    lightColor: [1.0, 0.98, 0.92]
    ambient: 0.3
  DOF Downsample: { shader: dofDownsample, focusDistance: 6.0, focusRange: 3.0 }
  DOF Blur H:     { shader: dofBlur, direction: Horizontal, maxBlurRadius: 1.0 }
  DOF Blur V:     { shader: dofBlur, direction: Vertical, maxBlurRadius: 1.0 }
  DOF Composite:  { shader: dofComposite, focusDistance: 6.0, focusRange: 3.0 }
  Present:        { shader: present }

edges:
  - Sponza.scene             -> Geometry.scene
  - Camera.view              -> Geometry.view

  - Geometry.albedo          -> Deferred Lighting.albedo
  - Geometry.normal          -> Deferred Lighting.normal
  - Geometry.worldPos        -> Deferred Lighting.worldPos
  - Camera.view              -> Deferred Lighting.view

  - Deferred Lighting.output -> DOF Downsample.color
  - Geometry.worldPos        -> DOF Downsample.worldPos
  - DOF Downsample.output    -> DOF Blur H.input
  - DOF Blur H.output        -> DOF Blur V.input

  - Deferred Lighting.output -> DOF Composite.color
  - DOF Blur V.output        -> DOF Composite.blurred
  - Geometry.worldPos        -> DOF Composite.worldPos

  - DOF Composite.output     -> Present.input
  - Present.output           -> swapchain
